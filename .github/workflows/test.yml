# Runs the tests on every push and pull request: with Agent Hooks only, and
# with AGT core installed (the AGT-native tests skip without it).
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        extras: ["dev", "dev,agt"]
        exclude:
          # AGT core 5.0 needs Python 3.11 or later.
          - python-version: "3.10"
            extras: "dev,agt"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q -W error::FutureWarning -rs
